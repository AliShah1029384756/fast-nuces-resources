name: Link Checker

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403
            --retry-wait-time 2
            --max-retries 2
            index.html README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
